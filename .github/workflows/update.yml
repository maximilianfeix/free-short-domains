name: update

# Installs the newest snapshot of maximilianfeix/shortfree's "data" release
# (its scan runs at 03:17 UTC) and commits it here if anything changed.
# manifest.json is replaced last by the publisher and names one immutable
# snapshot archive, so this never mixes files of two runs, even while the
# next run is being published.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: maximilianfeix/shortfree
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the manifest and the snapshot it names
        id: dl
        run: |
          set -euo pipefail
          if ! assets=$(gh release view data -R "$SOURCE" --json assets -q '.assets[].name' 2>&1); then
            if grep -qi "not found" <<<"$assets"; then
              echo "No data release in $SOURCE yet, nothing to update."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$assets"; exit 1
          fi
          if ! grep -qx manifest.json <<<"$assets"; then
            echo "::warning::$SOURCE has no manifest.json yet (published before snapshots existed); keeping the current lists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p dl
          gh release download data -R "$SOURCE" -D dl --clobber -p manifest.json
          archive=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"]["name"])' dl/manifest.json)
          [[ "$archive" =~ ^snapshot-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9a-z]+)?\.tar\.gz$ ]] || { echo "unexpected archive name: $archive"; exit 1; }
          gh release download data -R "$SOURCE" -D dl --clobber -p "$archive"
          echo "archive=dl/$archive" >> "$GITHUB_OUTPUT"
          ls -la dl

      - name: Verify and install the snapshot, rebuild the README
        if: steps.dl.outputs.skip != 'true'
        env:
          ARCHIVE: ${{ steps.dl.outputs.archive }}
        run: |
          set -euo pipefail
          # Checks the archive and every file against the manifest's SHA-256
          # sums; csv/, txt/ and four-letter/ are only replaced if all match.
          python scripts/snapshot.py --manifest dl/manifest.json --archive "$ARCHIVE" --changes-out dl/changes.json
          python scripts/readme.py --changes dl/changes.json
          du -sh csv txt four-letter

      - name: Commit if changed
        if: steps.dl.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A csv txt four-letter snapshot.json README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(python -c 'import json; print(json.load(open("snapshot.json"))["name"])')"
          git push
